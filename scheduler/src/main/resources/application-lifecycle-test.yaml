# Короткий цикл для ручной проверки планировщика.
# Чтобы включить: добавь lifecycle-test в spring.profiles.include у event и scheduler.
app:
  lifecycle:
    # За сколько минут до начала события отправлять напоминание пользователям
    remind-minutes-before: 1

    # Время в минутах после старта, в течение которого открыт расчет/прием репутации
    reputation-open-minutes: 2

    # Время в минутах после старта, по истечении которого расчет/прием репутации закрывается
    reputation-close-minutes: 5

    # Сколько минут удерживать/показывать опрос после его начала
    keep-poll-minutes-after-start: 4

    # Сколько минут удерживать/показывать экран разрешения (resolve) после окончания опроса
    keep-resolve-minutes-after-poll: 3

    # Время в минутах, в течение которого доступна отмена удаления объекта/действия
    cancel-delete-minutes: 2

    # Через сколько минут после провала опроса удалить чат
    keep-fail-delete-minutes: 5
