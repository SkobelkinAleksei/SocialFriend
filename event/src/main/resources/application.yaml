server:
  port: 8088

spring:
  application:
    name: event
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB

  profiles:
    include:
      - integration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social_event_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      org.springframework.cloud.gateway: DEBUG
      reactor.netty.http.client: DEBUG
      org.springframework.web: DEBUG
      org.hibernate.SQL: DEBUG
      org.springframework.orm.jpa: DEBUG

app:
  upload:
    dir: ./uploads/events
  internal:
    api-key: ${INTERNAL_API_KEY:local-internal-api-key-change-in-prod}
  lifecycle:
    remind-minutes-before: 60
    reputation-open-minutes: 180
    reputation-close-minutes: 10080
    keep-poll-minutes-after-start: 1440
    keep-resolve-minutes-after-poll: 1440
    cancel-delete-minutes: 720
    keep-fail-delete-minutes: 5
  outbox:
    relay-ms: 1000
    recover-ms: 30000
    batch-size: 20
    publish-timeout-seconds: 5
    stuck-sending-minutes: 2

management:
  server:
    port: 18088
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}