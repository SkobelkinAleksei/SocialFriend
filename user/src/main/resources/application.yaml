server:
  port: 8081

spring:
  application:
    name: user
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 12MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social_user_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:true}
      mail.smtp.ssl.trust: smtp.mail.ru
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG

# Internal service-to-service (минуя JWT gateway)
app:
  upload:
    dir: ./uploads/users
  internal:
    api-key: ${INTERNAL_API_KEY:local-internal-api-key-change-in-prod}
  outbox:
    relay-ms: 1000
    recover-ms: 30000
    batch-size: 20
    publish-timeout-seconds: 5
    stuck-sending-minutes: 2
  self-base-url: ${APP_USER_URL:http://localhost:8081}
  admin:
    bootstrap-user-ids: ${APP_ADMIN_USER_IDS:}
    bootstrap-emails: ${APP_ADMIN_EMAILS:}
  services:
    friend-base-url: ${APP_FRIEND_URL:http://localhost:8082}
    post-base-url: ${APP_POST_URL:http://localhost:8083}
    comment-base-url: ${APP_COMMENT_URL:http://localhost:8084}
    chat-base-url: ${APP_CHAT_URL:http://localhost:8087}
    event-base-url: ${APP_EVENT_URL:http://localhost:8088}
  mail:
    from: ${MAIL_FROM:}
    log-codes: ${MAIL_LOG_CODES:false}

management:
  server:
    port: 18081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
